zerops:
  - setup: dak-app
    build:
      base: nodejs@20
      buildCommands:
        - npm install
        - npm run build
      deployFiles:
        - .next
        - node_modules
        - package.json
        - public
        - app
    run:
      base: nodejs@20
      ports:
        - port: 3000
          httpSupport: true
      start: npm run start
      envVariables:
        NODE_ENV: production
        PORT: 3000
